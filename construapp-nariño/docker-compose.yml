services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: construapp-postgres
    environment:
      POSTGRES_DB: construapp_narino
      POSTGRES_USER: construapp_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-construapp_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Puerto 5433 en el host para no chocar con un PostgreSQL local en 5432.
      # El backend en desarrollo usa DB_PORT=5433 (ver backend/.env).
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U construapp_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - construapp-network

  # Redis para caché
  redis:
    image: redis:7-alpine
    container_name: construapp-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - construapp-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: construapp-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: construapp_narino
      DB_USER: construapp_user
      DB_PASSWORD: ${DB_PASSWORD:-construapp_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your_secret_key_change_in_production}
      CORS_ORIGIN: http://localhost:3000,http://localhost:8081
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/backend/logs
      - ./backend/uploads:/app/backend/uploads
    networks:
      - construapp-network
    restart: unless-stopped

  # Frontend web
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: construapp-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - construapp-network
    restart: unless-stopped

  # PgAdmin para administración de base de datos
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: construapp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@construapp.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - construapp-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  construapp-network:
    driver: bridge
